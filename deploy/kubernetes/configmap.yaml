apiVersion: v1
kind: ConfigMap
metadata:
  name: tessera-config
  namespace: tessera
  labels:
    app: tessera
data:
  # Network configuration
  network: "mainnet"

  # Seed nodes for discovery
  seed-nodes: |
    [
      {"peer_id": "tessera-core-0", "host": "tessera-core-0.tessera-core.tessera.svc.cluster.local", "port": 8100},
      {"peer_id": "tessera-core-1", "host": "tessera-core-1.tessera-core.tessera.svc.cluster.local", "port": 8100},
      {"peer_id": "tessera-core-2", "host": "tessera-core-2.tessera-core.tessera.svc.cluster.local", "port": 8100}
    ]

  # Node defaults
  max-peers: "50"
  min-peers: "3"
  proof-ttl: "3600"
---
apiVersion: v1
kind: Secret
metadata:
  name: tessera-tls
  namespace: tessera
  labels:
    app: tessera
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # Generate with: kubectl create secret tls tessera-tls --cert=cert.pem --key=key.pem
  tls.crt: ""
  tls.key: ""
