[project]
name = "tessera"
version = "0.2.0"
description = "Open-source privacy protocol for authenticated, metadata-private messaging: Schnorr zero-knowledge proofs with per-recipient key blinding, encrypted bucketed broadcast, and differentially-private cover traffic."
authors = [{ name = "Dipankar Sarkar", email = "me@dipankar.name" }]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Skelf-Research/tessera"
repository = "https://github.com/Skelf-Research/tessera"
documentation = "https://github.com/Skelf-Research/tessera#documentation"
keywords = ["zero-knowledge", "privacy", "metadata-private", "authentication", "messaging", "differential-privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=3.4.8",
    "ecdsa>=0.19.1",
    "flask>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "websockets>=12.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.0.0"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
tessera = "tessera.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tessera"]

[tool.pytest.ini_options]
asyncio_mode = "strict"