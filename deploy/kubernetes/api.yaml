apiVersion: apps/v1
kind: Deployment
metadata:
  name: calldns-api
  namespace: calldns
  labels:
    app: calldns
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calldns
      component: api
  template:
    metadata:
      labels:
        app: calldns
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: calldns:latest
          command: ["python", "-m", "calldns.service.api"]
          env:
            - name: CALLDNS_HOST
              value: "0.0.0.0"
            - name: CALLDNS_PORT
              value: "8000"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: calldns-api
  namespace: calldns
  labels:
    app: calldns
    component: api
spec:
  type: ClusterIP
  selector:
    app: calldns
    component: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calldns-api
  namespace: calldns
  labels:
    app: calldns
    component: api
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "calldns-api"
spec:
  rules:
    - host: api.calldns.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calldns-api
                port:
                  number: 8000
