global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'calldns-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: 'calldns-nodes'
    static_configs:
      - targets: ['core-1:8100', 'core-2:8100', 'org-bank-a:8100']
    metrics_path: /metrics
