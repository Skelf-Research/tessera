apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tessera-core
  namespace: tessera
  labels:
    app: tessera
    component: core
spec:
  serviceName: tessera-core
  replicas: 3
  selector:
    matchLabels:
      app: tessera
      component: core
  template:
    metadata:
      labels:
        app: tessera
        component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: core-node
          image: tessera:latest
          args:
            - "start"
            - "--type"
            - "core"
            - "--id"
            - "$(POD_NAME)"
            - "--port"
            - "8100"
            - "--host"
            - "0.0.0.0"
            - "--data-dir"
            - "/data"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8100
              name: node
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tessera-core
  namespace: tessera
  labels:
    app: tessera
    component: core
spec:
  clusterIP: None
  selector:
    app: tessera
    component: core
  ports:
    - port: 8100
      targetPort: 8100
      name: node
---
apiVersion: v1
kind: Service
metadata:
  name: tessera-core-lb
  namespace: tessera
  labels:
    app: tessera
    component: core
spec:
  type: LoadBalancer
  selector:
    app: tessera
    component: core
  ports:
    - port: 8100
      targetPort: 8100
      name: node
